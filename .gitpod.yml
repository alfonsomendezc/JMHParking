# .gitpod.yml — Vite (React) + Flask + Postgres
image:
  file: .gitpod.Dockerfile

vscode:
  extensions:
    - ms-python.python
    - ms-python.vscode-pylance
    - ms-azuretools.vscode-docker
    - esbenp.prettier-vscode
    - dbaeumer.vscode-eslint
    - bradlc.vscode-tailwindcss
    - cweijan.vscode-postgresql-client2

ports:
  - port: 5173
    onOpen: open-preview
    visibility: public
  - port: 5000
    onOpen: ignore
    visibility: public
  - port: 5432
    onOpen: ignore
    visibility: private

tasks:
  - name: Postgres
    init: |
      docker pull postgres:16
    command: |
      docker rm -f pg 2>/dev/null || true
      docker run --name pg \
        -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app \
        -p 5432:5432 -d postgres:16
      gp await-port 5432
      echo "Postgres up on localhost:5432 (db=app / user=app / pass=app)"

  - name: Backend (Flask)
    init: |
      python -m venv .venv
      source .venv/bin/activate
      # install deps (use your own requirements.txt if present)
      pip install --upgrade pip
      pip install flask flask-sqlalchemy flask-migrate flask-cors python-dotenv psycopg[binary]
      # envs for the backend
      export DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://app:app@localhost:5432/app}
      export FLASK_APP=JMH-Parking/src/backend/app.py
      # create migrations dir if not yet created; ignore errors otherwise
      flask db init || true
      flask db upgrade || true
    command: |
      source .venv/bin/activate
      export DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://app:app@localhost:5432/app}
      export FLASK_APP=JMH-Parking/src/backend/app.py
      export FLASK_RUN_HOST=0.0.0.0
      export FLASK_RUN_PORT=5000
      # pass the frontend origin (actual Gitpod URL for 5173)
      export FRONTEND_ORIGIN=$(gp url 5173)
      echo "FRONTEND_ORIGIN=$FRONTEND_ORIGIN"
      flask run

  - name: Frontend (Vite)
    init: |
      cd JMH-Parking/src/frontend
      (npm ci || npm install)
      API_URL=$(gp url 5000)
      echo "VITE_API_BASE_URL=$API_URL" > .env.local
      echo "Set VITE_API_BASE_URL to $API_URL"
    command: |
      cd JMH-Parking/src/frontend
      npm run dev -- --host --port 5173
